---
layout: default
---
<div class="home-page">
	<div>
		{{ content }}
		<div class="social-media-box">
			<a class='facebook-link' href='https://www.facebook.com/profile.php?id=61593436615873' target='_blank'>
				<span><i class="fa-brands fa-facebook"></i></span>The Institute of Mediaeval Music
			</a>
			<a class='insta-link' href='https://www.instagram.com/instmedmusic' target='_blank'>
				<span><i class="fa-brands fa-instagram"></i></span>@instmedmusic
			</a>
		</div>
	</div>
	<div>
		<figure class="homepage-figure">
			<picture>
				{% comment %}
					The size in @srcset is max viewport width to show that image source.
				{% endcomment %}
				<source
					sizes="30vw"
					srcset="
						{% for size in (3..7) %}
						{% capture img %}/assets/img/{{ page.homepage_image }}-{{ size }}00.webp{% endcapture %}
							{{ img | relative_url }} {{ size }}00w{% unless forloop.last %},{% endunless %}
						{% endfor %}
						"
					type="image/webp"
				>
				<source
					sizes="30vw"
					srcset="
						{% for size in (3..7) %}
							{% capture img %}/assets/img/{{ page.homepage_image }}-{{ size }}00.jpg{% endcapture %}
							{{ img | relative_url }} {{ size }}00w{% unless forloop.last %},{% endunless %}
						{% endfor %}
						"
					type="image/jpeg"
				>
				{% assign fallback_img = '/assets/img/{{ page.homepage_image }}-500.jpg' %}
				<img src="{{ fallback_img | relative_url }}">
			</picture>
			{% if page.image_credit %}
				<figcaption>{{ page.image_credit }}</figcaption>
			{% endif %}
		</figure>
	</div>
</div>
